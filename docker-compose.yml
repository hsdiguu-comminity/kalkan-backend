# Yerel geliştirme için PostgreSQL ve Redis.
# Başlatma: docker compose up -d   ·   Durdurma: docker compose down
# Başka bir projede 5432/6379 kullanılıyorsa .env içinde POSTGRES_PORT / REDIS_PORT değiştirin.
services:
  db:
    image: postgres:17-alpine
    container_name: kalkan-db
    environment:
      POSTGRES_USER: kalkan
      POSTGRES_PASSWORD: kalkan_local_dev
      POSTGRES_DB: kalkan
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kalkan-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalkan -d kalkan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kalkan-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  kalkan-db-data:
